name: Bishwa's Random Daily Commits

on:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}

      - name: Random commit
        shell: bash
        run: |
          FILE="commit_number.md"
          TODAY=$(date -u +"%Y-%m-%d")

          if [ ! -f "$FILE" ]; then
            echo "Hello, my name is bishwa shah" > "$FILE"
            echo "date: $TODAY" >> "$FILE"
            echo "commit number: 1" >> "$FILE"

            git config user.name "rishu1947-ops"
            git config user.email "rishu1947-ops@users.noreply.github.com"

            git add "$FILE"
            git commit -m "Hello, my name is bishwa shah nice to meet you"
            git push origin HEAD:main
            exit 0
          fi

          LAST_DATE=$(grep -oP 'date: \K.*' "$FILE" || true)
          CURRENT_COUNT=$(grep -oP 'commit number: \K\d+' "$FILE" || true)

          if [ "$LAST_DATE" != "$TODAY" ]; then
            CURRENT_COUNT=0
            echo "date: $TODAY" > "$FILE"
            echo "commit number: 0" >> "$FILE"
          fi

          if [ "$CURRENT_COUNT" -ge 3 ]; then
            echo "Already made 3 commits today."
            exit 0
          fi

          RANDOM_NUMBER=$((RANDOM % 100 + 1))

          if [ "$RANDOM_NUMBER" -gt 20 ]; then
            echo "No commit this time."
            exit 0
          fi

          NEXT_COUNT=$((CURRENT_COUNT + 1))
          sed -i "s/^commit number:.*/commit number: $NEXT_COUNT/" "$FILE"

          git config user.name "rishu1947-ops"
          git config user.email "rishu1947-ops@users.noreply.github.com"

          git add "$FILE"
          git commit -m "Hello, my name is bishwa shah nice to meet you"
          git push origin HEAD:main
